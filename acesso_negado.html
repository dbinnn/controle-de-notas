<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso negado — Controle de Notas</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-card">
    <img class="login-logo" src="{{ url_for('static', filename='logo.png') }}" alt="Controle de Notas">
    <div class="login-error-icon">×</div>
    <h1>Acesso negado</h1>
    <p class="login-sub">
      {% if email %}O e-mail <strong>{{ email }}</strong> não está autorizado.{% else %}Não foi possível confirmar o e-mail.{% endif %}
    </p>
    <a class="btn-google" href="{{ url_for('auth.login_google') }}">Tentar com outra conta</a>
  </main>
</body>
</html>
